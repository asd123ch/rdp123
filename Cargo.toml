[workspace]
resolver = "2"
members = [
    "crates/rdp123-core",
    "crates/rdp123-app",
    "xtask",
]

[workspace.package]
version = "0.7.7"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"

[workspace.dependencies]
# --- RDP protocol (IronRDP) ---
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-cliprdr = "0.9"
ironrdp-displaycontrol = "0.10"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpdr = "0.9"
ironrdp-pdu = { version = "0.11", features = ["std"] }
ironrdp-core = { version = "0.3", features = ["std"] }
ironrdp-tokio = "0.12"
# Graphics Pipeline (EGFX): AVC420/AVC444 via bundled OpenH264 (compiled from source,
# so end users need no binary downloads).
ironrdp-egfx = { version = "0.5", features = ["openh264-bundled"] }

# --- async / networking ---
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "io-util",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
aws-lc-rs = "1.19"
socket2 = "0.6"

# --- macOS platform ---
# objc2 framework crates activate ~all classes via default features; the
# inter-crate bridges (CoreFoundation/QuartzCore/CoreGraphics) must be opted in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-core-graphics",
] }
objc2-core-foundation = "0.3"
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "block2", "objc2-core-media", "objc2-core-video",
    "VTDecompressionSession", "VTDecompressionProperties", "VTErrors",
] }
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-io-surface = { version = "0.3", features = ["libc"] }
objc2-service-management = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
] }
block2 = "0.6"
dispatch2 = "0.3"
security-framework = "3"

# --- serialization / storage ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

# --- utilities ---
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.11"
base64 = "0.23"
url = "2.5"

# internal
rdp123-core = { path = "crates/rdp123-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Keep unused smart-card support optional in the connector.
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-svc = { path = "vendor/ironrdp-svc" }
ironrdp-dvc = { path = "vendor/ironrdp-dvc" }
